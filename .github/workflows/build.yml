name: Build

on:
  push:
    branches: [ main, 'vibe/**' ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore IV-game.Presentation/IV-game.Presentation.csproj -p:Platform=x64

      - name: Build
        run: dotnet build IV-game.Presentation/IV-game.Presentation.csproj -c Debug -p:Platform=x64 --no-restore

      - name: Verify content files are copied to output
        shell: pwsh
        run: |
          $out = Get-ChildItem -Recurse -Path "IV-game.Presentation/bin" -Filter "patient-cases.json" | Select-Object -First 1
          if (-not $out) { Write-Error "Content files not found in build output"; exit 1 }
          Write-Host "Content found: $($out.FullName)"
